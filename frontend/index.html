<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AegisBoard — Unified DFIR Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230A0E14'/><path d='M16 5l9 5v6c0 6-4 9.5-9 11-5-1.5-9-5-9-11v-6z' fill='none' stroke='%2322d3ee' stroke-width='2.4'/><path d='M12.5 16l2.6 2.6L19.8 14' stroke='%2322d3ee' stroke-width='2.4' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="7" fill="#0A0E14"/><path d="M16 5l9 5v6c0 6-4 9.5-9 11-5-1.5-9-5-9-11v-6z" fill="none" stroke="#22d3ee" stroke-width="2.4"/><path d="M12.5 16l2.6 2.6L19.8 14" stroke="#22d3ee" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">AegisBoard</div>
        <div class="brand-sub">Unified DFIR</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="status-line"><span class="dot pulse" id="status-dot"></span><span id="status-text">Connecting…</span></div>
      <div class="version">v1.0.0 · 8 engines</div>
    </div>
  </aside>
  <div id="main">
    <header id="topbar">
      <div id="crumb"></div>
      <div class="topbar-right">
        <span class="case-badge">BLACKECHO-001</span>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="toasts"></div>
<script src="/js/app.js"></script>
<script src="/js/views.js"></script>
</body>
</html>
